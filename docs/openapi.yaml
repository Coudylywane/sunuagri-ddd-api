components:
  schemas:
    ErreurApi:
      required:
      - chemin
      - code
      - horodatage
      - message
      type: object
      properties:
        code:
          type: string
          example: REGLE_METIER
        message:
          type: string
          example: La quantité minimale d'une commande est de 50 kg
        details:
          type: array
          items:
            type: string
        horodatage:
          type: string
          format: date-time
        chemin:
