openapi: 3.0.1
info:
  title: SunuAgri API
  description: |
    API de la coopérative agricole SunuAgri.
    L'authentification est simulée : chaque requête porte les en-têtes
    X-Utilisateur-Id (identifiant du producteur ou de l'acheteur selon le rôle)
    et X-Role (PRODUCTEUR, ACHETEUR, AGENT, ADMINISTRATEUR).
    Toutes les erreurs suivent le même format : code, message, details,
    horodatage et chemin.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Récoltes et stock
  description: "US-08, US-09"
- name: "Offres, commandes et paiements"
  description: "US-10 à US-14, US-16, US-17"
- name: Paramètres et prix du marché
  description: "US-18, US-19"
- name: Producteurs et parcelles
  description: "US-01, US-02, US-03, US-15, US-17"
- name: "Campagnes, cultures et récoltes"
  description: "US-04, US-05, US-06, US-07"
paths:
  /api/v1/parametres/cultures/{culture}:
    put:
      tags:
      - Paramètres et prix du marché
      operationId: modifier
      parameters:
      - name: culture
        in: path
        required: true
        schema:
          type: string
      - name: X-Utilisateur-Id
        in: header
        description: Identifiant de l'utilisateur simulé
        required: true
        schema:
          type: string
          example: "771234567"
      - name: X-Role
        in: header
        description: "Rôle simulé : PRODUCTEUR, ACHETEUR, AGENT ou ADMINISTRATEUR"
        required: true
        schema:
          type: string
          example: AGENT
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierParametre"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParametreCultureVue"
        "404":
          description: "Ressource introuvable, ou hors du périmètre de l'utilisateur"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErreurApi"
        "403":
          description: Rôle insuffisant pour l'opération
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErreurApi"
        "500":
          description: Erreur interne (aucun détail technique exposé)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErreurApi"
        "400":
          description: "Requête invalide (règle métier, paramètre ou corps mal formé\
            )"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErreurApi"
        "409":
          description: "Conflit avec l'état actuel (doublon, transition interdite)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErreurApi"
  /api/v1/recoltes/{recolteId}/livraisons:
